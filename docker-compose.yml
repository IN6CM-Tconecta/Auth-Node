# =============================================================
#  TransmetroConecta — Docker Compose ACTUALIZADO
#  Fase 2: auth-server (.NET) → auth-node (Node.js)
#
#  Ruta de este archivo: T-conecta/Auth-Node/docker-compose.yml
#  Los contextos de build son relativos a ESTA ubicación.
# =============================================================

services:

  # ============================================================
  # BASES DE DATOS
  # ============================================================

  postgres-db:
    image: postgres:16-alpine
    container_name: transmetro_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: TransmetroAuthDb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - transmetro_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongo-db:
    image: mongo:6.0
    container_name: transmetro_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - transmetro_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # MICROSERVICIO DE AUTENTICACIÓN — Node.js (reemplaza Auth-Server .NET)
  # Puerto público mantenido en 8080:8080 para compatibilidad total con
  # los clientes existentes (client-admin, client-user y otros servicios).
  # ============================================================

  auth-node:
    build:
      context: .                  # Raíz de T-conecta/Auth-Node/
      dockerfile: Dockerfile
    image: transmetro-auth-node:latest
    container_name: transmetro_auth_node
    ports:
      - "8080:8080"               # Mismo puerto externo que auth-server .NET
    environment:
      # ── Entorno de ejecución ────────────────────────────────
      - NODE_ENV=production
      - PORT=8080                 # Puerto interno del contenedor

      # ── PostgreSQL (paridad con ConnectionStrings:DefaultConnection) ─
      - DATABASE_URL=postgresql://postgres:postgres@postgres-db:5432/TransmetroAuthDb

      # ── JWT (paridad exacta con Jwt:Secret / Jwt:Issuer / Jwt:Audience) ─
      - JWT_SECRET=A_SUPER_SECRET_KEY_FOR_TRANSMETRO_CONECTA_12345
      - JWT_ISSUER=TransmetroAuthServer
      - JWT_AUDIENCE=TransmetroUsers
      - JWT_EXPIRES_IN=2h
      - JWT_RESET_EXPIRES_IN=15m

      # ── Wallet S2S (paridad con WalletService:BaseUrl + x-internal-secret) ─
      - WALLET_SERVICE_URL=http://server-client:3002
      - INTERNAL_SECRET=SuperSecretS2S_Transmetro2026

      # ── CORS ────────────────────────────────────────────────
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:5174
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - transmetro_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================
  # MICROSERVICIOS BACKEND (sin cambios)
  # ============================================================

  server-admin:
    build:
      context: ../Server-Admin/server-admin
      dockerfile: Dockerfile
    container_name: transmetro_server_admin
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongo-db:27017/TransmetroAdminDb
      - JWT_SECRET=A_SUPER_SECRET_KEY_FOR_TRANSMETRO_CONECTA_12345
      - AUTO_SEED=true
    depends_on:
      mongo-db:
        condition: service_healthy
    networks:
      - transmetro_network
    restart: unless-stopped

  server-client:
    build:
      context: ../Server-Client/server-client
      dockerfile: Dockerfile
    container_name: transmetro_server_client
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - MONGODB_URI=mongodb://mongo-db:27017/TransmetroUserDb
      - JWT_SECRET=A_SUPER_SECRET_KEY_FOR_TRANSMETRO_CONECTA_12345
      - INTERNAL_SECRET=SuperSecretS2S_Transmetro2026
    depends_on:
      mongo-db:
        condition: service_healthy
    networks:
      - transmetro_network
    restart: unless-stopped

  server-user:
    build:
      context: ../Server-User
      dockerfile: Dockerfile
    container_name: transmetro_server_user
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - MONGODB_URI=mongodb://mongo-db:27017/TransmetroUserDb
      - JWT_SECRET=A_SUPER_SECRET_KEY_FOR_TRANSMETRO_CONECTA_12345
      - INTERNAL_SECRET=SuperSecretS2S_Transmetro2026
    depends_on:
      mongo-db:
        condition: service_healthy
    networks:
      - transmetro_network
    restart: unless-stopped

  # ============================================================
  # CLIENTES FRONTEND (depends_on actualizado a auth-node)
  # ============================================================

  client-admin:
    build:
      context: ../Client-Admin
      dockerfile: Dockerfile
    container_name: transmetro_client_admin
    ports:
      - "5173:80"
    environment:
      - VITE_AUTH_URL=http://localhost:8080/api
      - VITE_ADMIN_URL=http://localhost:3001/TCONECTA/v1
    depends_on:
      - auth-node
      - server-admin
    networks:
      - transmetro_network
    restart: unless-stopped

  client-user:
    build:
      context: ../Client-User
      dockerfile: Dockerfile
    container_name: transmetro_client_user
    ports:
      - "5174:80"
    environment:
      - VITE_AUTH_URL=http://localhost:8080/api
      - VITE_ADMIN_URL=http://localhost:3001/TCONECTA/v1
      - VITE_CLIENT_URL=http://localhost:3002/TRANSMETRO-CONECTA-CLIENTE/v1
    depends_on:
      - auth-node
      - server-client
      - server-user
    networks:
      - transmetro_network
    restart: unless-stopped

# ============================================================
# VOLÚMENES Y REDES (sin cambios)
# ============================================================

volumes:
  pgdata:
  mongodata:

networks:
  transmetro_network:
    driver: bridge
